name: LIFT
options:
  bundleIdPrefix: com.lift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  LIFT:
    type: application
    platform: iOS
    sources:
      - path: LIFT
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        PRODUCT_BUNDLE_IDENTIFIER: com.lift.app
        TARGETED_DEVICE_FAMILY: "1"
  LIFTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LIFTTests
    dependencies:
      - target: LIFT
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lift.tests
